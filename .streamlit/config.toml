# Streamlit theme placeholder.
#
# Calm, neutral base with Okabe-Ito-friendly accent colors. Tweak
# colors here — never via st.markdown/<style> — to keep the design
# system honest and accessible (see CONTEXT.md §Color and §Aesthetics).

[theme]
base = "light"
primaryColor = "#0072B2"               # Okabe-Ito blue
backgroundColor = "#F1F3F7"            # off-white page canvas (cards sit on it as solid white)
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1F2328"
linkColor = "#0072B2"
borderColor = "#D0D7DE"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

baseFontSize = 15
headingFontWeights = [600, 600, 600, 500, 500, 500]

# Base UI font: Google Sans, served from the Google Fonts API via the
# [[theme.fontFaces]] tables at the bottom of this file (one variable woff2 per
# subset, weight axis 400–700). System sans-serif is the fallback for glyphs
# outside the latin / latin-ext subsets (e.g. the ↔ arrow).
font = "Google Sans, sans-serif"

# Categorical chart palette — colorblind-safe (Okabe & Ito).
chartCategoricalColors = [
    "#0072B2",
    "#E69F00",
    "#009E73",
    "#CC79A7",
    "#56B4E9",
    "#D55E00",
    "#F0E442",
]

# Sequential palette — Viridis (perceptually uniform). Exactly 10 stops.
chartSequentialColors = [
    "#FDE725",
    "#B5DE2B",
    "#6DCD59",
    "#35B779",
    "#1F9E89",
    "#26828E",
    "#31688E",
    "#3E4A89",
    "#482878",
    "#440154",
]

# Semantic status colors — also Okabe-Ito.
blueColor = "#0072B2"
greenColor = "#009E73"
yellowColor = "#F0E442"
orangeColor = "#E69F00"
redColor = "#D55E00"
violetColor = "#CC79A7"

[theme.dark]
primaryColor = "#56B4E9"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
linkColor = "#56B4E9"
borderColor = "#30363D"

# --- Google Sans webfont (Google Fonts API) --------------------------------
# Google Sans ships as a single variable woff2 per Unicode subset (weight axis
# 400–700), so one face per subset with a weight range covers regular (400),
# medium (500) and the 600 heading weight. URLs + unicode-ranges are taken from
# https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700 (gstatic
# v69). latin covers µ/°/–/↑↓; latin-ext covers ń (e.g. "Gdańsk"). Loaded by the
# browser straight from gstatic — works locally and on Streamlit Community Cloud.
[[theme.fontFaces]]
family = "Google Sans"
url = "https://fonts.gstatic.com/s/googlesans/v69/4UasrENHsxJlGDuGo1OIlJfC6l_24rlCK1Yo_Iqcsih3SAyH6cAwhX9RPjIUvbQoi-E.woff2"
weight = "400 700"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Google Sans"
url = "https://fonts.gstatic.com/s/googlesans/v69/4UasrENHsxJlGDuGo1OIlJfC6l_24rlCK1Yo_Iqcsih3SAyH6cAwhX9RPjwUvbQoi-Entw.woff2"
weight = "400 700"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"
